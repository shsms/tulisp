[package]
name = "tulisp"
description = "An embeddable lisp interpreter."
version = "0.32.0"
repository = "https://github.com/shsms/tulisp"
license = "GPL-3.0-only"
edition = "2024"
keywords = ["lisp", "scripting", "emacs-lisp"]
categories = ["compilers", "config"]
rust-version = "1.88.0"
include = ["/src", "/examples", "/tests/*.lisp", "/README.md", "/LICENSE"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "tulisp"
path = "src/bin/tulisp.rs"

[lib]
name = "tulisp"
path = "src/lib.rs"

[profile.release]
lto = true

[[bench]]
name = "fib"
harness = false

[[bench]]
name = "list_build"
harness = false

[[bench]]
name = "bool_results"
harness = false

[features]
sync = []
etags = []

[package.metadata.docs.rs]
features = ["etags"]
rustdoc-args = ["--cfg", "docsrs"]
